; PlatformIO Project Configuration File for AI-Proctor ESP32 Alert Actuator
; Smart Examination Surveillance System - Physical Alert Device

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM4
monitor_port = COM4

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=0
